# Runs Vyral behind Caddy, which gets and renews a free HTTPS certificate automatically.
# VYRAL_DOMAIN comes from the .env file. See DEPLOY.md.
services:
  vyral:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      VYRAL_HOSTED: "1"
      VYRAL_BIND_HOST: "0.0.0.0"
      VYRAL_PUBLIC_URL: "https://${VYRAL_DOMAIN:?Set VYRAL_DOMAIN in .env}"
    expose:
      - "8765"
    # Temporary working files only. Everything lasting is stored in Supabase.
    volumes:
      - vyral_work:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${VYRAL_DOMAIN} --to vyral:8765
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - vyral
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  vyral_work:
  caddy_data:
  caddy_config:
